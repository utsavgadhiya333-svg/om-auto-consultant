<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variants - Om Auto Consultant</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: #11152a;
            border-bottom: 2px solid #ffffff;
            flex-wrap: wrap;
        }
        header .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        header .logo img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }
        header .logo .logo-text {
            display: flex;
            flex-direction: column;
        }
        header .logo .logo-text h1 {
            font-size: 24px;
            color: #ffffff;
            line-height: 1.1;
        }
        header .logo .logo-text p {
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
        }

        header nav {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        header nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            transition: 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
        }
        header nav a:hover {
            background: #ffffff;
            color: #000;
            border-color: #ffffff;
            transform: scale(1.05);
        }

        .section-container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
        }
        .section-container .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 24px;
            background: #ffffff;
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
            font-weight: 600;
            border: 2px solid #ffffff;
        }
        .section-container .back-btn:hover {
            background: transparent;
            color: #ffffff;
            border-color: #ffffff;
            transform: scale(1.05);
        }
        .section-container h2 {
            font-size: 32px;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: #1a1f3a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #ffffff;
            box-shadow: 0 10px 40px rgba(255,255,255,0.1);
        }
        .card .img-box {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #0b0e1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* ✅ IMAGE FIX - Full and Clear */
        .card .img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: 0.3s;
            background: #0b0e1a;
            padding: 10px;
        }
        .card:hover .img-box img {
            transform: scale(1.05);
        }
        .card .title {
            text-align: center;
            padding: 15px;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #0b0e1a;
            color: #666;
            border-top: 1px solid #1a1f3a;
            margin-top: auto;
        }

        .loading-text {
            color: #888;
            text-align: center;
            padding: 40px;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .error-text {
            color: #ff6b6b;
            text-align: center;
            padding: 40px;
            font-size: 18px;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 12px 20px;
                gap: 12px;
            }
            header .logo img {
                height: 35px;
            }
            header .logo .logo-text h1 {
                font-size: 18px;
            }
            header .logo .logo-text p {
                font-size: 10px;
            }
            header nav {
                justify-content: center;
                gap: 12px;
            }
            header nav a {
                padding: 6px 16px;
                font-size: 13px;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
            .section-container h2 {
                font-size: 26px;
            }
        }
        @media (max-width: 480px) {
            header .logo img {
                height: 30px;
            }
            header .logo .logo-text h1 {
                font-size: 15px;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            .card .img-box {
                height: 150px;
            }
            .card .title {
                font-size: 16px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Om Auto Consultant Logo" />
            <div class="logo-text">
                <h1>🚛 Om Auto Consultant</h1>
                <p>Your Trusted Tempo Partner</p>
            </div>
        </div>
        <nav>
            <a href="index.html">🏠 Home</a>
            <a href="contact.html">📞 Contact</a>
        </nav>
    </header>

    <section class="section-container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        <h2 id="pageTitle">🚚 Variants</h2>
        <div class="grid-container" id="variantsGrid">
            <p class="loading-text">Loading variants...</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Om Auto Consultant. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://rifpaagfkxhrplokguqp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpZnBhYWdma3hocnBsb2tndXFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mjk0MzMsImV4cCI6MjEwMTUwNTQzM30.YvsCH6GPeA1kFWn7eenz-Y-Yc8c_kg3QTJbSGzAqg2w";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function getMainModels() {
            try {
                const { data, error } = await sb.from('main_models').select('*').order('id', { ascending: true });
                if (error) throw error;
                return data || [];
            } catch (e) { return []; }
        }

        async function getVariants() {
            try {
                const { data, error } = await sb.from('variants').select('*').order('id', { ascending: true });
                if (error) throw error;
                return data || [];
            } catch (e) { return []; }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const mainId = parseInt(urlParams.get('id'));

        async function renderVariants() {
            const grid = document.getElementById('variantsGrid');
            grid.innerHTML = `<p class="loading-text">Loading variants...</p>`;

            try {
                const mainModels = await getMainModels();
                const allVariants = await getVariants();
                const mainModel = mainModels.find(m => m.id === mainId);

                document.getElementById('pageTitle').textContent = mainModel ? `🚚 ${mainModel.name}` : '🚚 Variants';

                if (mainModels.length === 0) {
                    grid.innerHTML = `<p class="error-text">❌ No models found.</p>`;
                    return;
                }

                let filtered = allVariants.filter(v => v.main_model_id === mainId);

                if (filtered.length === 0) {
                    grid.innerHTML = `<p class="error-text" style="color:#888;">No variants available for this model.</p>`;
                    return;
                }

                grid.innerHTML = filtered.map(v => `
                    <div class="card" onclick="window.location.href='model-detail.html?id=${v.id}&variant=${encodeURIComponent(v.name)}'">
                        <div class="img-box">
                            <img src="${v.cover || 'https://picsum.photos/seed/default/400/300'}" 
                                 alt="${v.name}" 
                                 onerror="this.src='https://picsum.photos/seed/default/400/300'" />
                        </div>
                        <div class="title">${v.name}</div>
                    </div>
                `).join('');

            } catch (e) {
                grid.innerHTML = `<p class="error-text">❌ Error loading variants.</p>`;
            }
        }

        renderVariants();
    </script>
</body>
</html>
